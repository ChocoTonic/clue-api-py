name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Verify release tag matches package version
        run: test "v$(uv version --short)" = "${GITHUB_REF_NAME}"
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run python scripts/generate_openapi.py --check
      - run: uv run pytest --cov=clue_api --cov-report=term-missing
      - run: uv build
      - name: Smoke-test built wheel
        run: |
          smoke_dir="$(mktemp -d)"
          uv venv "$smoke_dir/.venv"
          uv pip install --python "$smoke_dir/.venv/bin/python" dist/*.whl
          PACKAGE_VERSION="${GITHUB_REF_NAME#v}" "$smoke_dir/.venv/bin/python" -c 'import os, clue_api; assert clue_api.__version__ == os.environ["PACKAGE_VERSION"]; assert len(clue_api.READ_ENDPOINTS) == 42'
          "$smoke_dir/.venv/bin/clue-api" spec > "$smoke_dir/openapi.json"
          PACKAGE_VERSION="${GITHUB_REF_NAME#v}" "$smoke_dir/.venv/bin/python" -c 'import json, os, sys; assert json.load(open(sys.argv[1]))["info"]["version"] == os.environ["PACKAGE_VERSION"]' "$smoke_dir/openapi.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: verify-and-build
    environment:
      name: pypi
      url: https://pypi.org/project/clue-api-py/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist/
      - name: Publish distribution
        uses: pypa/gh-action-pypi-publish@a892a5a61159132606e93a2fa6f4358831b04d26 # v1.14.2
