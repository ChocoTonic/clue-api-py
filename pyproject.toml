[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "clue-api-py"
version = "0.2.0"
description = "Unofficial Python client for querying Clue period tracker data"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ChocoTonic" }]
keywords = ["clue", "clue-api", "helloclue", "health", "period-tracker", "period-tracking", "menstrual-cycle", "cycle-tracking", "api-client", "python"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[dependency-groups]
dev = [
  "mypy>=1.13,<2",
  "openapi-spec-validator>=0.7.2,<0.10",
  "pydantic>=2.13.5,<3; python_version >= '3.14'",
  "pytest>=8,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
]
research = ["mitmproxy>=12.2,<13; python_version >= '3.12'"]

[project.scripts]
clue-api = "clue_api.__main__:main"

[project.urls]
Homepage = "https://github.com/ChocoTonic/clue-api-py"
Repository = "https://github.com/ChocoTonic/clue-api-py"
Issues = "https://github.com/ChocoTonic/clue-api-py/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/clue_api"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs/openapi.json",
  "/scripts/generate_openapi.py",
  "/README.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["clue_api"]

[tool.uv]
required-version = ">=0.12.15,<0.13"
default-groups = ["dev"]
